[package]
name = "displayd"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ddcci = { path = "../ddcci" }
edid = { path = "../edid" }

tokio = { version = "1", features = [
    "net",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
] }